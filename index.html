<style>
:root{box-sizing:border-box;color-scheme:light;--paper:#f6f8fc;--card:#fff;--cardt:rgba(255,255,255,.68);--ink:#1a2033;--mut:#59627f;--rule:#d5dcf0;--pen:#1c3a9e;--pent:#fff;--margin:#c8413b;--soft:#e9eefb;--warn:#7a3b00;--wbg:#fff1dc;--ok:#116a3c;--okbg:#e2f5e9;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--paper:#10131d;--card:#192033;--cardt:rgba(25,32,51,.68);--ink:#e6e9f5;--mut:#9aa4c4;--rule:#232c47;--pen:#9db4ff;--pent:#0e1630;--margin:#ff8a82;--soft:#222c4a;--warn:#ffc98a;--wbg:#3a2a12;--ok:#7be0a6;--okbg:#14301f}}
:root[data-theme="dark"]{color-scheme:dark;--paper:#10131d;--card:#192033;--cardt:rgba(25,32,51,.68);--ink:#e6e9f5;--mut:#9aa4c4;--rule:#232c47;--pen:#9db4ff;--pent:#0e1630;--margin:#ff8a82;--soft:#222c4a;--warn:#ffc98a;--wbg:#3a2a12;--ok:#7be0a6;--okbg:#14301f}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper) repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px);color:var(--ink);font:16px/1.5 Lexend,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
body::after{content:"";position:fixed;inset-block:0;inset-inline-start:12px;width:2px;background:var(--margin);opacity:.5;pointer-events:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-block-end:2px solid var(--margin);padding:10px 16px 0 28px}
.brand{font-weight:600;font-size:20px;color:var(--pen);letter-spacing:-.01em}
nav{margin-block-start:6px}nav .nr{display:flex;gap:2px;overflow-x:auto}nav .nr button{padding:10px 5px;font-size:14px}nav .nr.sub{background:rgba(127,127,127,.08);border-radius:8px}nav .nr.sub button{font-size:14px;padding:6px 10px}
nav button{flex:1 0 auto;white-space:nowrap;background:none;border:0;border-block-end:3px solid transparent;padding:10px 10px;font:inherit;color:var(--mut);cursor:pointer}
nav button[aria-current]{color:var(--pen);border-block-end-color:var(--pen);font-weight:600}
main{max-width:720px;margin-inline:auto;padding:8px 16px 48px 28px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-block:14px}
h1,h2{margin:0 0 6px;color:var(--pen);font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}
p{margin:6px 0}.mut{color:var(--mut)}.lab{margin:14px 0 4px;font-size:13px;color:var(--mut)}
label{display:block;margin-block-start:10px;font-size:13px;color:var(--mut)}
input:not([type=checkbox]):not([type=file]),select,textarea{display:block;width:100%;margin-block-start:3px;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.btn{background:var(--pen);color:var(--pent);border:1px solid var(--pen);border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;margin-block-start:12px}
.btn.ghost{background:none;color:var(--pen)}
.btn.danger{background:none;color:var(--margin);border-color:var(--margin)}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chk{display:inline-flex;gap:6px;align-items:center;margin:0;font-size:15px;color:var(--ink)}
.sub{border-inline-start:3px solid var(--rule);padding-inline-start:12px;margin-block:12px}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-block-end:1px solid var(--rule)}
.chip{font-size:13px;border-radius:99px;padding:1px 10px;background:var(--soft);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.todo{background:var(--wbg);color:var(--warn)}
.warn,.note{border-radius:8px;padding:10px 12px;margin-block:12px}
.warn{background:var(--wbg);color:var(--warn)}.note{background:var(--soft);color:var(--pen)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px}.mh h2{margin:0;text-transform:capitalize}.mh .btn{margin:0;padding:6px 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-block-start:10px;text-align:center}.cal span{font-size:12px;color:var(--mut)}
.d{aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid transparent;font-size:14px;background:none;color:inherit;font-family:inherit;padding:0;cursor:pointer}
.d.off{color:var(--mut);opacity:.6}.d.today{outline:2px solid var(--pen);outline-offset:-2px;font-weight:600}
.k-break{background:var(--soft);border:1px solid var(--pen)}.k-hol{background:var(--margin);color:var(--pent)}
.k-start,.k-end{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}.k-pend{background:var(--wbg);color:var(--warn);border:1px dashed var(--warn)}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:12px}.slot{padding:6px 0;border-block-end:1px dashed var(--rule)}.slot.lost{color:var(--mut)}.dayh{font-weight:600;color:var(--pen)}.evl i{margin-inline-end:4px}
.lg i,.evi i,.evl i{font-style:normal;font-size:12px;border-radius:99px;padding:1px 9px}
.evl li{display:block}.ar{direction:rtl;unicode-bidi:isolate;color:var(--mut);font-size:14px}
.dts{position:absolute;inset-block-end:3px;inset-inline:0;display:flex;gap:2px;justify-content:center}.dt{display:inline-block;width:6px;height:6px;border-radius:50%;padding:0!important;vertical-align:middle}.dt-teach{background:var(--pen)}.dt-meet{background:#8a56c2}.dt-obs{background:#1b9a8a}.dt-tp{background:#e0842a}.dt-test{background:#d64545}.dt-synth{background:#b0156b}.dt-extra{background:#2e9e57}.dt-abs{background:transparent;border:1.5px solid #777;width:7px;height:7px}.lgd{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-inline-end:8px;color:var(--mut)}.lgd .dt{width:9px;height:9px}.d.sel{box-shadow:0 0 0 2px var(--pen)}
.k-own{background:var(--pen);color:var(--pent)}.evi .btn{margin-block-start:6px;padding:4px 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}#lk{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:62%}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px;border:1.5px solid var(--mut);background:var(--mut)}.dot.on{background:#2e9e57;border-color:#2e9e57;box-shadow:0 0 0 3px rgba(46,158,87,.2)}.dot.off{background:#d64545;border-color:#d64545}.dot.warn{background:#e0a020;border-color:#e0a020}.dot.loc{background:transparent}#lk .sdt{flex:1 0 100%;text-align:right;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;padding:0;cursor:pointer}.top .btn{margin:0;padding:4px 12px;font-size:14px}
.bul{margin:4px 0 8px;padding-inline-start:20px}.th{padding:10px 14px}.th summary{cursor:pointer}
.k-yel{background:var(--wbg);color:var(--warn);border:1px solid var(--warn)}.k-org{background:var(--warn);color:var(--pent)}
.bar{position:relative;height:14px;background:var(--soft);border-radius:7px;overflow:hidden;margin:6px 0}.bar .fill{position:absolute;inset-block:0;inset-inline-start:0;background:var(--pen)}.bar .fill.orange{background:var(--warn)}.bar .fill.green{background:var(--ok)}.fill.ahead{background:#3b82f6}.k-ahead{background:#dbeafe;color:#1e3a8a;border:1px solid #3b82f6}details.prog{margin-block:12px}details.prog>summary{cursor:pointer;font-size:17px;font-weight:700;color:var(--pen);padding:10px 0}details.sec{margin-block:4px}details.sec>summary{cursor:pointer;font-weight:600;padding:6px 0}details.sub>summary{cursor:pointer;font-weight:600}.bar .mk{position:absolute;inset-block:0;width:3px;background:var(--margin)}.bar .mk.own{background:var(--ink);opacity:.6}
a.btn{display:inline-block;text-decoration:none;margin-block-start:12px}.row a.btn{margin:0}

const guideCard=()=>`<section class="card"><details class="sec" data-k="guide"${op('guide',true)}><summary><b>Guide : à quoi sert l’appli</b></summary>
<p><b>Carnet d’enseignant</b> accompagne l’enseignante toute l’année : elle y garde son emploi du temps, ses classes et groupes, le programme officiel et ses documents de cours. L’appli place les séquences sur les semaines, suit l’avancement réel par rapport au programme, signale les retards et aide à les rattraper. Après chaque séance, elle rédige pour vous un petit journal de bord à partager (anonymisé par défaut). Tout fonctionne sans connexion ; les données restent sur l’appareil et peuvent être sauvegardées en ligne (Google Drive ou GitHub) pour les retrouver sur un autre appareil.</p>
<h3>Pas à pas</h3>
<ol>
<li><b>Profil.</b> Touchez votre nom en haut : renseignez l’enseignant, l’école, et choisissez le thème clair ou sombre.</li>
<li><b>Réglages.</b> Dans <i>Classes</i>, créez vos classes (chacune a deux groupes) et ajoutez les élèves, à saisir ou à coller. Dans <i>Calendrier</i>, importez le calendrier scolaire (vacances, jours fériés) et ajoutez vos devoirs et événements. Créez l’emploi du temps dans <i>Semaine → Ma semaine</i>.</li>
<li><b>Programme.</b> Dans <i>Programme</i>, importez ou choisissez le programme officiel (thèmes, séquences, situations). Rattachez-y vos documents de cours : liens en ligne et copies hors ligne facultatives.</li>
<li><b>Préparer la semaine suivante.</b> Chaque semaine, ouvrez <i>Semaine → Préparation</i> : lisez et confirmez les séances prévues, joignez les documents de la semaine, et reprenez ce qui avait été reporté.</li>
<li><b>Enseigner.</b> En fin de journée, ouvrez <i>Aujourd’hui</i> et touchez « Fait comme prévu », puis ouvrez <i>Bilan</i> pour corriger les exceptions : choisissez comment la séance s’est passée, ajustez les points traités (✓ traité, ◐ introduit, ○ non abordé), notez ce qui a marqué la séance, puis les documents, absents, discipline et cahiers. Si l’avancement est inférieur à 100 %, choisissez de reporter le reste aux séances suivantes du groupe. Le journal de bord est écrit automatiquement ; corrigez-le si besoin.</li>
<li><b>Suivre.</b> <i>Suivi → Avancement</i> compare les groupes entre eux et au programme (vert à l’heure, jaune puis orange puis rouge en retard). le « Plan du programme », sous chaque groupe, permet de planifier un rattrapage ou d’ajouter une séance.</li>
<li><b>Partager.</b> Dans <i>Suivi → Partage</i>, envoyez un planning, l’avancement ou le journal de bord par PDF, e-mail ou WhatsApp. Les noms d’élèves sont anonymisés sauf si vous choisissez les vrais noms. L’auto-évaluation et les notes personnelles restent privées.</li>
<li><b>Sauvegarder.</b> Dans <i>Réglages → Sauvegarde</i>, reliez Google Drive ou GitHub : les modifications sont enregistrées et reçues automatiquement sur les autres appareils du même compte. Pensez à vérifier les mises à jour plus bas dans cette page.</li>
